<!doctype html>
<!-- 分享卡片（1200×630）的画板：分享到微信/QQ/X 时那张图就从这一页截出来。
     它不是站内页面——build.py 不会把它发布出去，只有 sharecard.py 用它。
     改文案/排布：改这个文件，然后 python3 sharecard.py（会重新生成 assets/share-card.png）。
     数字是从 build.py 现算的，别在这里手写死。 -->
<html lang="zh-CN" data-ef-variant="{{VARIANT}}" data-theme="{{THEME}}">
  <head>
    <meta charset="utf-8" />
    <title>分享卡片</title>
    <link rel="preload" as="font" crossorigin href="{{ASSETS}}Saira.ttf" />
    <!-- 强调色靠这段 JS 把轴向写到 <html> 上（和站内页面一样）；不带它就只会拿到默认正黄。 -->
    <script src="{{ASSETS}}variant.js"></script>
    <link rel="stylesheet" href="{{ASSETS}}endfield.css" />
    <link rel="stylesheet" href="{{ASSETS}}site.css" />
    <style>
      /* 字体没到位就先别画拉丁部分：font-display:block 让它空着，而不是先拿系统字体
         顶一遍——顶出来的宽度和真字体不一样，截图就会和线上对不上。
         sharecard.py 截图前还会等到 document.fonts.status=loaded。 */
      @font-face {
        font-family: 'Saira Variable';
        src: url('{{ASSETS}}Saira.ttf') format('truetype-variations'), url('{{ASSETS}}Saira.ttf') format('truetype');
        font-weight: 100 900; font-stretch: 50% 125%; font-display: block;
      }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      .card {
        height: 100%; box-sizing: border-box; padding: 3.25rem 3.5rem 2.25rem;
        display: grid; grid-template-columns: minmax(0, 1fr) 19rem;
        grid-template-rows: auto minmax(0, 1fr) auto; gap: 1.25rem 3rem;
      }
      .card .top { grid-column: 1; grid-row: 1; }
      .card .mid { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; gap: 1.15rem; }
      .card .ef-frame { grid-column: 2; grid-row: 1 / 3; margin: 0 0 2.5rem; }
      .card .ef-frame svg { width: 100%; height: 100%; }
      .card .ef-wordmark { --ef-wordmark: 4.4rem; }
      .card .claim { margin: 0; font-size: 2.55rem; line-height: 1.34; }
      .card .bio { margin: 0; max-width: 33rem; color: var(--ef-ink-2); font-size: 1.05rem; line-height: 1.75; }
      .card .ef-facts { margin-top: 0.4rem; font-size: 1.05rem; }
      .card .ef-facts b { font-family: var(--ef-font-ui); font-stretch: var(--ef-wide); font-size: 1.5rem; font-weight: 800; }
      .card .foot {
        grid-column: 1 / -1; grid-row: 3; display: flex; flex-wrap: wrap; align-items: baseline;
        gap: 0.6rem 1.5rem; border-top: 1px solid var(--ef-rule); padding-top: 1.1rem;
      }
      .card .url { font-family: var(--ef-font-ui); font-stretch: var(--ef-wider); font-size: 1.4rem; letter-spacing: 0.1em; }
      .card .foot .r { margin-left: auto; color: var(--ef-ink-2); font-size: 0.95rem; }
    </style>
  </head>
  <body class="ef ef-contours">
    <div class="card">
      <div class="top">
        <p class="ef-eyebrow slash">{{EYEBROW}}</p>
        <h1 class="ef-wordmark"><span class="solid">{{SOLID}}</span><span class="hollow" aria-hidden="true">{{HOLLOW}}</span></h1>
      </div>
      <div class="mid">
        <p class="claim ef-read"><span class="ef-marker">{{CLAIM}}</span></p>
        <p class="bio ef-read">{{BIO}}</p>
        <ul class="ef-facts">{{FACTS}}</ul>
      </div>
{{FRAME}}
      <div class="foot">
        <span class="url">{{URL}}</span>
        <span class="r">最近更新 {{UPDATED}}</span>
      </div>
    </div>
  </body>
</html>
