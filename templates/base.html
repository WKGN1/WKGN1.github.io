<!doctype html>
<!-- 全站骨架。外观来自 endfield.css，布局来自 site.css，名字和内容来自 site.json。 -->
<html lang="zh-CN" data-ef-variant="{{VARIANT}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 字体提前拉：拉得晚就会先用系统字体画一遍再换过来，数字滚动时宽度会跟着跳一下 -->
    <link rel="preload" as="font" crossorigin href="{{ASSETS}}Saira.ttf" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESC}}" />
    <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}if(/[?&]noanim/.test(location.search))document.documentElement.dataset.noanim='1';try{var q=new URLSearchParams(location.search);if(q.get('theme')==='dark'||q.get('theme')==='light')document.documentElement.dataset.theme=q.get('theme');}catch(e){}</script>
    <script src="{{ASSETS}}variant.js"></script>
    <link rel="stylesheet" href="{{ASSETS}}endfield.css" />
    <link rel="stylesheet" href="{{ASSETS}}site.css" />
    <!-- 图标：SVG 给新浏览器，位图给只认 favicon.png / 加到桌面的那些。形状由 favicon.py 生成。 -->
    <link rel="icon" type="image/svg+xml" href="{{ASSETS}}favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="{{ASSETS}}favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ASSETS}}apple-touch-icon.png" />
    <link rel="alternate" type="application/rss+xml" title="{{BRAND}} · 订阅（RSS）" href="{{FEED}}" />
    <link rel="canonical" href="{{CANON}}" />
    <!-- 分享到微信/QQ/X 时抓的就是这几条；卡片图由 sharecard.py 生成（1200×630）。 -->
    <meta property="og:type" content="{{OG_TYPE}}" />
    <meta property="og:site_name" content="{{BRAND}}" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESC}}" />
    <meta property="og:url" content="{{CANON}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{DESC}}" />
    {{OG_ARTICLE}}
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESC}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />
    {{HEAD_EXTRA}}
  </head>
  <body class="ef ef-contours">
    <div class="ef-tri ef-in-sweep" aria-hidden="true"><i></i><i></i><i></i></div>
{{BODY}}
    <!-- 主题按钮的兜底，纯 ES5：老内核（微信安卓端 X5 常见是 Chromium 77）解析不了
         fx.js 时，按钮照样能切换深浅。fx.js 跑成功会给按钮写上 aria-pressed，
         这段一看就不插手，圆形展开的切换动画仍然归 fx.js 管。 -->
    <script>
      (function () {
        var html = document.documentElement;
        var STORE = 'theme';
        function saved() {
          try { var v = localStorage.getItem(STORE); return (v === 'light' || v === 'dark') ? v : ''; } catch (e) { return ''; }
        }
        function sysDark() {
          try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { return false; }
        }
        function dark() { var s = saved(); return s ? s === 'dark' : sysDark(); }
        function buttons() { return document.querySelectorAll('[data-theme-toggle]'); }
        function mark() {
          var b = buttons(), i;
          for (i = 0; i < b.length; i++) b[i].setAttribute('aria-pressed', dark() ? 'true' : 'false');
        }
        function flip() {
          var next = dark() ? 'light' : 'dark';
          html.setAttribute('data-theme', next);
          try { localStorage.setItem(STORE, next); } catch (e) {}
          mark();
        }
        function wire() {
          var b = buttons(), i;
          for (i = 0; i < b.length; i++) {
            if (b[i].getAttribute('data-theme-fallback') === '1') continue;
            b[i].setAttribute('data-theme-fallback', '1');
            b[i].addEventListener('click', flip);
          }
          mark();
        }
        function check() {
          var b = document.querySelector('[data-theme-toggle]');
          if (!b) return;                                       // 这一页没有这个按钮
          if (b.getAttribute('aria-pressed') !== null) return;  // fx.js 已经接手
          wire();
        }
        function later() {
          check();                 // 模块脚本按规矩在 DOMContentLoaded 之前就该执行完
          setTimeout(check, 1200); // 再兜一次，万一这台机器上顺序不对
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', later);
        else later();
      })();
    </script>
    <script type="module">
      import { wireReadouts, wireTheme, wireParallax } from '{{MODULE}}fx.js';
      wireReadouts();
      wireTheme();
      wireParallax(document.querySelector('[data-hero]'));
    </script>
  </body>
</html>
